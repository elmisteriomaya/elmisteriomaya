<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>El Misterio Maya</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="game-container">

        <div class="maya-symbol">
            ☀
        </div>


        <section class="login-box">

            <h1>EL MISTERIO</h1>

            <h2>MAYA</h2>

            <p class="subtitle">
                Descubre los secretos de una antigua civilización
            </p>


            <div class="divider"></div>


            <div class="input-group">

                <label for="username">
                    GUERRERO
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Ingresa tu nombre"
                    autocomplete="username"
                >

            </div>


            <div class="input-group">

                <label for="password">
                    CONTRASEÑA
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                >

            </div>


            <button
                id="loginButton"
                class="main-button"
            >
                ⚔ INICIAR PARTIDA
            </button>


            <button
                id="registerButton"
                class="register-button"
            >
                CREAR CUENTA
            </button>


            <p id="message"></p>

        </section>


        <footer class="footer">
            ✦ El conocimiento es el camino hacia el misterio ✦
        </footer>

    </main>


    <script src="login.js"></script>

</body>

</html>
